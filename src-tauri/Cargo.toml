[package]
name = "theme-package-editor"
version = "1.0.0"
description = "Theme Package Editor desktop application"
authors = ["qtrade"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
tauri = { version = "2.10.3", features = [] }
tauri-plugin-dialog = "2.7.0"
tauri-plugin-fs = "2.5.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSOpenPanel", "NSSavePanel", "NSApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSString", "NSArray", "NSURL"] }
